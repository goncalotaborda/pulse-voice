version: '3.8'

services:
  pulse-voice:
    build: .
    container_name: pulse-voice
    restart: unless-stopped
    ports:
      - "3050:3000"
    environment:
      - PORT=3000
      - SERVER_PASSWORD=teste123

  pulse-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: pulse-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - pulse-voice