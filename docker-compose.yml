version: '3.8'

services:
  pulse-voice:
    build: .
    container_name: pulse-voice
    restart: unless-stopped
    ports:
      - "3050:3000"
    environment:
      - PORT=3000
      - SERVER_PASSWORD=teste123
      - DATA_DIR=/app/data
      - MUSIC_DIR=/app/music
      - LIVEKIT_API_KEY=concord_api_key
      - LIVEKIT_API_SECRET=concord_secret_key_oracle_2026_x9k2m8
      - LIVEKIT_URL=ws://100.123.196.21:7880
    volumes:
      - pulse_data:/app/data
      - /home/ubuntu/concord-music:/app/music:ro

  livekit:
    image: livekit/livekit-server:latest
    container_name: concord-livekit
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - /home/ubuntu/livekit.yaml:/etc/livekit.yaml:ro

volumes:
  pulse_data: