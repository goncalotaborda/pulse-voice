version: '3.8'

services:
  pulse-voice:
    build: .
    container_name: pulse-voice
    restart: unless-stopped
    ports:
      - "3050:3000"
    environment:
      - PORT=3000
      - SERVER_PASSWORD=amigos2026 # Altera para a palavra-passe do teu grupo

  Pulse-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: pulse-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://pulse-voice:3000
    depends_on:
      - pulse-voice