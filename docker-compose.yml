services:
  pulse-voice:
    build: .
    container_name: pulse-voice
    restart: unless-stopped
    ports:
      - "3050:3000"
    environment:
      - PORT=3000
      - SERVER_PASSWORD=teste123
      - DATA_DIR=/app/data
    volumes:
      - concord_data:/app/data

  pulse-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: pulse-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://pulse-voice:3000
    depends_on:
      - pulse-voice

volumes:
  concord_data: